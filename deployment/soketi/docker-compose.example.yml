services:
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    restart: unless-stopped
    environment:
      SOKETI_DEBUG: "0"
      SOKETI_DEFAULT_APP_ID: "nntm"
      SOKETI_DEFAULT_APP_KEY: "CHANGE_ME_APP_KEY"
      SOKETI_DEFAULT_APP_SECRET: "CHANGE_ME_APP_SECRET"
      SOKETI_METRICS_SERVER_PORT: "9601"
    ports:
      - "127.0.0.1:6001:6001"
      - "127.0.0.1:9601:9601"
